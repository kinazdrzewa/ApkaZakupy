## Use a file-based H2 database so data persists between restarts
# Creates files under the application working directory (./data/)
# Use a simple file URL (avoid AUTO_SERVER/DB_CLOSE_ON_EXIT flags that
# some H2 builds report as unsupported when combined)
spring.datasource.url=jdbc:h2:file:./data/apkazupy
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Explicit driver and dialect help Hibernate determine DB when classloader isolation (devtools) is used
spring.datasource.driver-class-name=org.h2.Driver
hibernate.dialect=org.hibernate.dialect.H2Dialect

# Hibernate DDL mode: update keeps schema and preserves data across restarts
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
logging.level.org.hibernate.SQL=DEBUG